# ══════════════════════════════════════════════════════════════
# Flux Monitor — local / staging stack
#
#   docker compose up -d                # mysql + backend + scheduler + frontend
#   docker compose --profile azure up   # + Azurite (local Azure emulation)
#
# Prerequisites:
#   - copy .env.example to backend/.env (backend/scheduler) and keep the
#     root .env in sync for compose interpolation (MYSQL_* defaults below)
#   - frontend service needs ./frontend/dist:  cd frontend && npm ci && npm run build
#     (skip it with:  docker compose up -d mysql backend scheduler)
#
# Single scheduler guarantee:
#   The web tier starts with FLASK_EMBEDDED_SCHEDULER=0; only the
#   `scheduler` container runs SLA monitoring + daily reports
#   (scheduler_worker.py). Never scale `backend` expecting cron work.
# ══════════════════════════════════════════════════════════════

services:
  mysql:
    image: mysql:8.0.36
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw-dev-only}
      MYSQL_DATABASE: ${MYSQL_DB:-flux_monitor}
      MYSQL_USER: ${MYSQL_USER:-flux}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fluxpass-dev-only}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/create_tables.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    image: flux-monitor-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      # In-container DSN: service name, not 127.0.0.1.
      # Override MYSQL_* in root .env for real values.
      MYSQL_URL: mysql+pymysql://${MYSQL_USER:-flux}:${MYSQL_PASSWORD:-fluxpass-dev-only}@mysql:3306/${MYSQL_DB:-flux_monitor}?charset=utf8mb4
      LOCAL_DB_PATH: /app/instance/flux.db
      FLASK_EMBEDDED_SCHEDULER: "0"
      PORT: "8000"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - instance-data:/app/instance
      - reports-data:/app/reports
    restart: unless-stopped

  scheduler:
    image: flux-monitor-backend   # reuses the image built by `backend`
    command: python scheduler_worker.py
    env_file:
      - ./backend/.env
    environment:
      MYSQL_URL: mysql+pymysql://${MYSQL_USER:-flux}:${MYSQL_PASSWORD:-fluxpass-dev-only}@mysql:3306/${MYSQL_DB:-flux_monitor}?charset=utf8mb4
      LOCAL_DB_PATH: /app/instance/flux.db
      ENABLE_SCHEDULER: "true"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - instance-data:/app/instance
      - reports-data:/app/reports
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.30.0
    profiles: ["azure"]
    ports:
      - "10000:10000"   # Blob
      - "10002:10002"   # Queue
      - "10003:10003"   # Table
    volumes:
      - azurite-data:/data
    command: "azurite --silent --location /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0"

volumes:
  mysql-data:
  instance-data:
  reports-data:
  azurite-data:
