version: "3.9"
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    ports:
      - "10000:10000"   # Blob
      - "10002:10002"   # Queue
      - "10003:10003"   # Table
    volumes:
      - azurite-data:/data
    command: "azurite --silent --location /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0"

volumes:
  azurite-data:
