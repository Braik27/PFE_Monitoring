# Azure Pipeline — Flux Monitor
# Builds the React frontend, then builds & pushes the Docker image to ACR

trigger:
  - master

resources:
  - repo: self

variables:
  dockerRegistryServiceConnection: "5dfb7dae-1f64-4b57-8256-7633afaff32c"
  imageRepository: "pfeamani"
  containerRegistry: "flasktraineracr.azurecr.io"
  dockerfilePath: "backend/Dockerfile"
  tag: "$(Build.BuildId)"
  vmImageName: "ubuntu-latest"

stages:
  # ── Stage 1: Build React Frontend ───────────────────────────────
  - stage: Frontend
    displayName: Frontend Build
    jobs:
      - job: BuildFrontend
        displayName: Build React app
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Install Node.js
            inputs:
              versionSpec: "20.x"

          - task: Cache@2
            displayName: Cache npm dependencies
            inputs:
              key: 'npm | "$(Agent.OS)" | frontend/package-lock.json'
              path: frontend/node_modules
              cacheHitVar: NPM_CACHE_RESTORED

          - script: npm ci
            displayName: npm install
            workingDirectory: frontend
            condition: ne(variables.NPM_CACHE_RESTORED, 'true')

          - script: npm run build
            displayName: Build frontend
            workingDirectory: frontend

          - script: npx tsc --noEmit
            displayName: TypeScript check
            workingDirectory: frontend

          - publish: frontend/dist
            displayName: Publish frontend build artifact
            artifact: frontend-dist

  # ── Stage 2: Backend unit tests (parallel to Frontend) ──────────
  # Runs BEFORE any Docker build/push: a red suite blocks the image.
  - stage: Tests
    displayName: Backend Tests
    dependsOn: []
    jobs:
      - job: Pytest
        displayName: Run pytest suite
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            displayName: Install Python 3.12
            inputs:
              versionSpec: "3.12"

          - task: Cache@2
            displayName: Cache pip downloads
            inputs:
              key: 'pip | "$(Agent.OS)" | backend/requirements.txt'
              path: $(Pipeline.Workspace)/.pip
          - script: pip config set global.cache-dir $(Pipeline.Workspace)/.pip
            displayName: Point pip cache dir

          # Full requirements (not a slim subset): keeps CI dependency
          # parity with the Docker image; heavy wheels come from cache.
          - script: |
              pip install --upgrade pip
              pip install -r backend/requirements.txt pytest
            displayName: Install backend deps + pytest

          - script: python -m pytest tests/ watcher/test_watcher_logic.py -q --tb=short
            displayName: pytest (SLA + severity/alerts + watcher)

  # ── Stage 3: Build & Push Docker Image ──────────────────────────
  - stage: Docker
    displayName: Docker Build & Push
    dependsOn:
      - Frontend
      - Tests
    jobs:
      - job: BuildDocker
        displayName: Build and push image
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self

          - download: current
            displayName: Download frontend artifact
            artifact: frontend-dist

          # Inject the pre-built SPA INSIDE the backend/ build context.
          # The Dockerfile copies it to /app/frontend/dist via `COPY . .`.
          - script: |
              mkdir -p backend/frontend/dist
              cp -r "$(Pipeline.Workspace)/frontend-dist/"* backend/frontend/dist/
            displayName: Inject pre-built frontend into build context

          - task: Docker@2
            displayName: Build and push to ACR
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              buildContext: "$(Build.SourcesDirectory)/backend"
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)
                v1
